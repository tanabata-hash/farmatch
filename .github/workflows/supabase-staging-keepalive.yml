name: Supabase staging keep-alive

# Supabase の無料プランは 7 日間アクティビティがないと自動停止される。
# farmatch-staging を止めないよう、2 日おきに DB へ軽いクエリを送る。
on:
  schedule:
    - cron: "17 3 */2 * *"   # 2 日おき 03:17 UTC (= 12:17 JST)
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query staging database via PostgREST
        env:
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::STAGING_SUPABASE_URL / STAGING_SUPABASE_ANON_KEY secrets are not set"
            exit 1
          fi
          for table in farms houses users; do
            code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
              --retry 3 --retry-delay 5 --max-time 30 \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              "$SUPABASE_URL/rest/v1/$table?select=id&limit=1")
            echo "$table -> HTTP $code"
            if [ "$code" = "200" ]; then ok=1; fi
          done
          if [ -z "$ok" ]; then
            echo "::error::All queries failed. Project may be paused - check the Supabase dashboard."
            exit 1
          fi
